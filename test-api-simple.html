<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test API LowPadel - Simple</title>
    <style>
        body {
            font-family: monospace;
            max-width: 900px;
            margin: 20px auto;
            padding: 20px;
            background: #1e1e1e;
            color: #d4d4d4;
        }
        .test {
            background: #2d2d2d;
            padding: 15px;
            margin: 15px 0;
            border-radius: 8px;
            border-left: 4px solid #007acc;
        }
        button {
            background: #007acc;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
            font-size: 14px;
        }
        button:hover {
            background: #005a9e;
        }
        .result {
            margin-top: 10px;
            padding: 10px;
            background: #1e1e1e;
            border-radius: 4px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .success { border-left-color: #4ec9b0; }
        .error { border-left-color: #f48771; }
        h1 { color: #4ec9b0; }
        h2 { color: #dcdcaa; font-size: 18px; }
    </style>
</head>
<body>
    <h1>🎾 Test API LowPadel</h1>
    <p>Servidor: <strong id="server">http://localhost:4321</strong></p>

    <div class="test">
        <h2>1️⃣ Test Conexión</h2>
        <button onclick="testConnection()">Probar</button>
        <div class="result" id="result1"></div>
    </div>

    <div class="test">
        <h2>2️⃣ Registrar Usuario</h2>
        <button onclick="testRegister()">Registrar</button>
        <div class="result" id="result2"></div>
    </div>

    <div class="test">
        <h2>3️⃣ Login</h2>
        <button onclick="testLogin()">Login</button>
        <div class="result" id="result3"></div>
    </div>

    <div class="test">
        <h2>4️⃣ Ver Perfil</h2>
        <button onclick="testProfile()">Ver Perfil</button>
        <div class="result" id="result4"></div>
    </div>

    <script>
        const API = 'http://localhost:4321/api';
        let token = '';

        function log(id, message, isError = false) {
            const el = document.getElementById(id);
            el.textContent = message;
            el.parentElement.className = isError ? 'test error' : 'test success';
        }

        async function testConnection() {
            try {
                log('result1', '⏳ Conectando...');
                const res = await fetch(`${API}/test-connection`);
                const text = await res.text();
                log('result1', `Status: ${res.status}\n\n${text}`);
            } catch (error) {
                log('result1', `❌ ERROR:\n${error.message}`, true);
            }
        }

        async function testRegister() {
            try {
                log('result2', '⏳ Registrando...');
                const timestamp = Date.now();
                const userData = {
                    nombre: 'Test User',
                    email: `test${timestamp}@lowpadel.com`,
                    password: 'test1234'
                };
                console.log('Enviando datos:', userData);
                
                const res = await fetch(`${API}/auth/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(userData)
                });
                const text = await res.text();
                console.log('Respuesta completa:', text);
                log('result2', `Status: ${res.status}\n\nRespuesta:\n${text}`);
                
                // Guardar token si fue exitoso
                try {
                    const data = JSON.parse(text);
                    if (data.token) {
                        token = data.token;
                        console.log('Token guardado:', token);
                    }
                    if (data.error) {
                        console.error('Error del servidor:', data.error);
                    }
                } catch (e) {
                    console.error('Error parseando JSON:', e);
                }
            } catch (error) {
                console.error('Error de fetch:', error);
                log('result2', `❌ ERROR:\n${error.message}\n${error.stack}`, true);
            }
        }

        async function testLogin() {
            try {
                log('result3', '⏳ Iniciando sesión...');
                const res = await fetch(`${API}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: 'test@lowpadel.com',
                        password: 'test1234'
                    })
                });
                const text = await res.text();
                log('result3', `Status: ${res.status}\n\n${text}`);
                
                // Guardar token
                try {
                    const data = JSON.parse(text);
                    if (data.token) {
                        token = data.token;
                        console.log('Token guardado:', token);
                    }
                } catch (e) {}
            } catch (error) {
                log('result3', `❌ ERROR:\n${error.message}`, true);
            }
        }

        async function testProfile() {
            try {
                if (!token) {
                    log('result4', '❌ No hay token. Haz login primero.', true);
                    return;
                }
                log('result4', '⏳ Obteniendo perfil...');
                const res = await fetch(`${API}/user/profile`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                const text = await res.text();
                log('result4', `Status: ${res.status}\n\n${text}`);
            } catch (error) {
                log('result4', `❌ ERROR:\n${error.message}`, true);
            }
        }
    </script>
</body>
</html>
