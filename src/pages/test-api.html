<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test API Backend - LowPadel</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f1f5f9;
      padding: 2rem;
      min-height: 100vh;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 {
      color: #00c896;
      text-align: center;
      margin-bottom: 2rem;
      font-size: 2.5rem;
      text-shadow: 0 2px 10px rgba(0, 200, 150, 0.3);
    }

    .status {
      background: rgba(0, 200, 150, 0.1);
      border: 2px solid #00c896;
      border-radius: 15px;
      padding: 1.5rem;
      margin-bottom: 2rem;
      text-align: center;
    }

    .status.error {
      background: rgba(239, 68, 68, 0.1);
      border-color: #ef4444;
    }

    .status.success {
      background: rgba(34, 197, 94, 0.1);
      border-color: #22c55e;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    button {
      background: linear-gradient(135deg, #00c896 0%, #6ee7b7 100%);
      color: #0f172a;
      border: none;
      padding: 1rem 1.5rem;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 200, 150, 0.4);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .output {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 15px;
      padding: 1.5rem;
      min-height: 200px;
      max-height: 500px;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      font-size: 0.9rem;
      line-height: 1.6;
    }

    .log {
      margin-bottom: 1rem;
      padding: 0.5rem;
      border-radius: 5px;
    }

    .log.success {
      background: rgba(34, 197, 94, 0.1);
      border-left: 3px solid #22c55e;
    }

    .log.error {
      background: rgba(239, 68, 68, 0.1);
      border-left: 3px solid #ef4444;
    }

    .log.info {
      background: rgba(59, 130, 246, 0.1);
      border-left: 3px solid #3b82f6;
    }

    pre {
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .section {
      margin-bottom: 2rem;
    }

    .section h2 {
      color: #9333ea;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧪 Test API Backend - LowPadel</h1>
    
    <div id="status" class="status">
      <h2>Estado: Esperando...</h2>
    </div>

    <div class="section">
      <h2>🔐 Autenticación</h2>
      <div class="buttons">
        <button onclick="testConexion()">📡 Test Conexión MongoDB</button>
        <button onclick="testRegistro()">✍️ Registrar Usuario</button>
        <button onclick="testLogin()">🔑 Login</button>
        <button onclick="testPerfil()">👤 Ver Perfil</button>
      </div>
    </div>

    <div class="section">
      <h2>🎾 Palas</h2>
      <div class="buttons">
        <button onclick="testListarPalas()">📋 Listar Palas</button>
        <button onclick="testCrearPala()">➕ Crear Pala (Admin)</button>
      </div>
    </div>

    <div class="section">
      <h2>📰 Noticias</h2>
      <div class="buttons">
        <button onclick="testListarNoticias()">📋 Listar Noticias</button>
        <button onclick="testCrearNoticia()">➕ Crear Noticia (Admin)</button>
      </div>
    </div>

    <div class="section">
      <h2>🚀 Tests Completos</h2>
      <div class="buttons">
        <button onclick="ejecutarTodasLasPruebas()" style="background: linear-gradient(135deg, #9333ea 0%, #c084fc 100%);">🎯 Ejecutar Todas las Pruebas</button>
        <button onclick="limpiarOutput()" style="background: linear-gradient(135deg, #ef4444 0%, #f87171 100%);">🗑️ Limpiar Console</button>
      </div>
    </div>

    <div class="section">
      <h2>📊 Output</h2>
      <div id="output" class="output">
        <div class="log info">Esperando comandos...</div>
      </div>
    </div>
  </div>

  <script>
    const outputDiv = document.getElementById('output');
    const statusDiv = document.getElementById('status');

    function log(message, type = 'info') {
      const logDiv = document.createElement('div');
      logDiv.className = `log ${type}`;
      logDiv.innerHTML = `<pre>${message}</pre>`;
      outputDiv.appendChild(logDiv);
      outputDiv.scrollTop = outputDiv.scrollHeight;
    }

    function updateStatus(message, type = 'info') {
      statusDiv.className = `status ${type}`;
      statusDiv.innerHTML = `<h2>${message}</h2>`;
    }

    function limpiarOutput() {
      outputDiv.innerHTML = '<div class="log info">Console limpiada...</div>';
      updateStatus('Estado: Esperando...', 'info');
    }

    async function testConexion() {
      log('🔄 Probando conexión a MongoDB...', 'info');
      try {
        const response = await fetch('/api/test-connection');
        const data = await response.json();
        
        if (response.ok && data.success) {
          log('✅ Conexión exitosa a MongoDB Atlas!', 'success');
          log(`Base de datos: ${data.baseDeDatos}`, 'success');
          log(`Host: ${data.host}`, 'success');
          log(`Estado: ${data.estado}`, 'success');
          log(JSON.stringify(data, null, 2), 'success');
          updateStatus('✅ MongoDB conectado correctamente', 'success');
        } else {
          throw new Error(data.message || 'Error desconocido');
        }
      } catch (error) {
        log(`❌ Error: ${error.message}`, 'error');
        log('Verifica: 1) IP permitida en Atlas, 2) Credenciales correctas, 3) .env configurado', 'error');
        updateStatus('❌ Error de conexión', 'error');
      }
    }

    async function testRegistro() {
      log('🔄 Registrando usuario...', 'info');
      try {
        const response = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            nombre: 'Usuario Test',
            email: `test${Date.now()}@lowpadel.com`,
            password: '123456'
          })
        });
        
        const data = await response.json();
        
        if (data.success) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('usuario', JSON.stringify(data.user));
          log('✅ Usuario registrado exitosamente!', 'success');
          log(JSON.stringify(data, null, 2), 'success');
          updateStatus('✅ Usuario registrado y token guardado', 'success');
        } else {
          throw new Error(data.message);
        }
      } catch (error) {
        log(`❌ Error: ${error.message}`, 'error');
        updateStatus('❌ Error en registro', 'error');
      }
    }

    async function testLogin() {
      log('🔄 Iniciando sesión...', 'info');
      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: 'test@lowpadel.com',
            password: '123456'
          })
        });
        
        const data = await response.json();
        
        if (data.success) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('usuario', JSON.stringify(data.user));
          log('✅ Login exitoso!', 'success');
          log(JSON.stringify(data, null, 2), 'success');
          updateStatus('✅ Login exitoso - Token guardado', 'success');
        } else {
          throw new Error(data.message);
        }
      } catch (error) {
        log(`❌ Error: ${error.message}`, 'error');
        updateStatus('❌ Error en login', 'error');
      }
    }

    async function testPerfil() {
      log('🔄 Obteniendo perfil...', 'info');
      const token = localStorage.getItem('token');
      
      if (!token) {
        log('❌ No hay token. Debes hacer login primero.', 'error');
        return;
      }

      try {
        const response = await fetch('/api/user/profile', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        
        const data = await response.json();
        
        if (data.success) {
          log('✅ Perfil obtenido!', 'success');
          log(JSON.stringify(data, null, 2), 'success');
          updateStatus(`✅ Usuario: ${data.user.nombre} (${data.user.rol})`, 'success');
        } else {
          throw new Error(data.message);
        }
      } catch (error) {
        log(`❌ Error: ${error.message}`, 'error');
        updateStatus('❌ Error obteniendo perfil', 'error');
      }
    }

    async function testListarPalas() {
      log('🔄 Listando palas...', 'info');
      try {
        const response = await fetch('/api/palas');
        const data = await response.json();
        
        if (data.success) {
          log(`✅ ${data.count} palas encontradas!`, 'success');
          log(JSON.stringify(data, null, 2), 'success');
          updateStatus(`✅ ${data.count} palas en el sistema`, 'success');
        } else {
          throw new Error(data.message);
        }
      } catch (error) {
        log(`❌ Error: ${error.message}`, 'error');
        updateStatus('❌ Error listando palas', 'error');
      }
    }

    async function testCrearPala() {
      log('🔄 Creando pala...', 'info');
      const token = localStorage.getItem('token');
      
      if (!token) {
        log('❌ No hay token. Debes hacer login primero.', 'error');
        return;
      }

      try {
        const response = await fetch('/api/palas', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({
            nombre: 'Vertex 03 Test',
            jugador: 'Arturo Coello',
            precio: 299.99,
            imagen: '/palas/coello/vertex03.png',
            descripcion: 'Pala de control máximo',
            stock: 50,
            categoria: 'profesional'
          })
        });
        
        const data = await response.json();
        
        if (data.success) {
          log('✅ Pala creada exitosamente!', 'success');
          log(JSON.stringify(data, null, 2), 'success');
          updateStatus('✅ Pala creada correctamente', 'success');
        } else {
          throw new Error(data.message);
        }
      } catch (error) {
        log(`❌ Error: ${error.message}`, 'error');
        updateStatus('❌ Error creando pala', 'error');
      }
    }

    async function testListarNoticias() {
      log('🔄 Listando noticias...', 'info');
      try {
        const response = await fetch('/api/noticias');
        const data = await response.json();
        
        if (data.success) {
          log(`✅ ${data.count} noticias encontradas!`, 'success');
          log(JSON.stringify(data, null, 2), 'success');
          updateStatus(`✅ ${data.count} noticias en el sistema`, 'success');
        } else {
          throw new Error(data.message);
        }
      } catch (error) {
        log(`❌ Error: ${error.message}`, 'error');
        updateStatus('❌ Error listando noticias', 'error');
      }
    }

    async function testCrearNoticia() {
      log('🔄 Creando noticia...', 'info');
      const token = localStorage.getItem('token');
      
      if (!token) {
        log('❌ No hay token. Debes hacer login primero.', 'error');
        return;
      }

      try {
        const response = await fetch('/api/noticias', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({
            titulo: 'Nuevo Torneo de Pádel 2025',
            contenido: 'Se anuncia el torneo más importante del año...',
            imagen: '/noticias/torneo-2025.jpg',
            categoria: 'torneos',
            tags: ['torneo', 'profesional', 'madrid'],
            destacada: true
          })
        });
        
        const data = await response.json();
        
        if (data.success) {
          log('✅ Noticia creada exitosamente!', 'success');
          log(JSON.stringify(data, null, 2), 'success');
          updateStatus('✅ Noticia creada correctamente', 'success');
        } else {
          throw new Error(data.message);
        }
      } catch (error) {
        log(`❌ Error: ${error.message}`, 'error');
        updateStatus('❌ Error creando noticia', 'error');
      }
    }

    async function ejecutarTodasLasPruebas() {
      limpiarOutput();
      log('🚀 Iniciando suite completa de pruebas...', 'info');
      updateStatus('🔄 Ejecutando pruebas...', 'info');
      
      await testConexion();
      await new Promise(r => setTimeout(r, 1000));
      
      await testRegistro();
      await new Promise(r => setTimeout(r, 1000));
      
      await testLogin();
      await new Promise(r => setTimeout(r, 1000));
      
      await testPerfil();
      await new Promise(r => setTimeout(r, 1000));
      
      await testListarPalas();
      await new Promise(r => setTimeout(r, 1000));
      
      await testListarNoticias();
      
      log('🎉 ¡Todas las pruebas completadas!', 'success');
      updateStatus('🎉 Suite de pruebas finalizada', 'success');
    }

    // Auto-test de conexión al cargar
    window.addEventListener('load', () => {
      setTimeout(testConexion, 500);
    });
  </script>
</body>
</html>
